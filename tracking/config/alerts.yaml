# Règles d'alerte. Toutes les valeurs sont modifiables sans toucher au code.
# Comparaison par défaut : moyenne journalière des 7 derniers jours vs moyenne des 28 jours précédents.

general:
  fenetre_jours: 7          # période analysée
  reference_jours: 28       # période de comparaison
  volume_minimum: 30        # en dessous (sur la période de référence), on n'alerte pas : bruit statistique
  repetition_jours: 7       # une même alerte n'est renvoyée qu'au bout de N jours

# Qui reçoit quoi
notifications:
  # Messages Slack en cours de semaine : uniquement les situations qui demandent une action rapide.
  # Tout le reste figure dans le rapport PDF du lundi.
  severite_quotidienne: haute      # haute | moyenne | info
  # Une variation deux fois plus forte que le seuil de la règle devient « Priorité haute »
  # (ex. seuil −30 % → alerte urgente à partir de −60 %).
  escalade_variation: 2
  # En dessous de ce volume de référence (sur 28 jours), une variation n'est jamais jugée urgente.
  volume_minimum_urgent: 30

# Objectifs hebdomadaires (mettez vos chiffres). Alerte si la semaine finit en dessous.
objectifs_semaine:
  demos_booked: 5
  signups: 15
  trial_conversions: 3

# Alertes sur l'évolution d'un indicateur.
# metrique : nom de la métrique ; par_canal : une alerte par canal ; variation : seuil en % (négatif = baisse)
variations:
  - id: visibilite_baisse
    etape: Visibilité
    metrique: impressions
    par_canal: true
    variation: -30
    severite: moyenne
    action: "Contrôler le budget et le statut des campagnes, ainsi que le rythme de publication sur ce canal."

  - id: cpm_hausse
    etape: Visibilité
    ratio: [spend, impressions, 1000]   # coût pour 1000 impressions
    par_canal: true
    variation: 40
    severite: moyenne
    action: "Renouveler les visuels publicitaires ou élargir l'audience ciblée."

  - id: recherches_marque_baisse
    etape: Visibilité
    metrique: branded_searches
    variation: -25
    severite: haute
    action: "Renforcer la présence de marque : publications LinkedIn, relations presse, événements."

  - id: trafic_ia_baisse
    etape: Visibilité
    metrique: ai_sessions
    variation: -40
    severite: moyenne
    action: "Mettre à jour les contenus repris par les IA : pages comparatives, FAQ, cas clients."

  - id: sessions_baisse
    etape: Intérêt
    metrique: sessions
    par_canal: true
    variation: -30
    severite: moyenne
    action: "Vérifier les liens, le référencement et les campagnes actives sur ce canal."

  - id: inscriptions_baisse
    etape: Intérêt
    metrique: signups
    variation: -30
    severite: haute
    action: "Tester le formulaire d'inscription, puis revoir la page tarifs et les campagnes en cours."

  - id: taux_inscription_baisse
    etape: Intérêt
    ratio: [signups, sessions, 100]
    variation: -30
    severite: haute
    action: "Tester le parcours d'inscription de bout en bout et vérifier la qualité du trafic entrant."

  - id: demos_baisse
    etape: Intérêt
    metrique: demos_booked
    variation: -40
    severite: moyenne
    action: "Relancer les prospects qualifiés et rendre la prise de démo plus visible sur le site."

  - id: churn_hausse
    etape: Rétention
    metrique: churned
    variation: 50
    severite: haute
    action: "Contacter les clients sortants pour comprendre les raisons de leur départ."

# Sites référents (presse, partenaires, annuaires) vus dans GA4
referents:
  visites_min_nouveau: 5    # alerte "nouveau site" à partir de 5 visites en 7 jours
  jours_historique: 60      # "nouveau" = aucune visite de ce site pendant les 60 jours précédents

# Seuils GEO (part des questions où Flugia est citée par l'IA)
geo:
  taux_minimum: 20          # alerte si moins de 20 % des questions citent Flugia
  baisse_points: 15         # ou si le taux perd 15 points d'une semaine à l'autre

# Veille Crunchbase (sans API) : alertes quand le profil doit être mis à jour à la main
crunchbase:
  revue_jours: 90           # revue complète conseillée au-delà de N jours sans mise à jour
  changements_jours: 45     # un changement détecté sur flugia.com reste signalé N jours

# Conversion essai -> payant (sur les essais terminés pendant les 28 derniers jours)
conversion_essai:
  taux_minimum: 15          # en %
  essais_minimum: 5         # nombre d'essais terminés minimum pour juger

# Alertes par compte client (listes d'actions)
comptes:
  essai_chaud:              # à appeler pour conclure
    jour_essai_min: 10
    usage_7j_min: 20        # crédits consommés sur 7 jours
  essai_bloque:             # inscrit mais n'a rien activé
    jours_depuis_inscription: 3
  risque_churn:             # client payant dont l'usage s'effondre
    baisse_usage_pct: 50
    usage_prev_30j_min: 20
  renouvellement:             # liste visible dans le tableau de bord
    jours_avant_echeance: 14
    alerte: false             # true = une alerte Slack par renouvellement (utile pour des contrats annuels)
